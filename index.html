/* Layout: encabezado, resumen, calendario mensual + agenda, plan semanal. Un solo look oscuro con la paleta del portfolio (tinta, papel, ácido). */
:root{
  --ink:#1D1D1B; --paper:#F5F5F5; --acid:#FF4000;
  --bg:var(--ink); --surface:#252523; --fg:var(--paper); --muted:rgba(245,245,245,.62); --line:rgba(245,245,245,.35); --accent:var(--acid);
  --sans:'NHD','Neue Haas Grotesk Display','Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:'Roboto Mono',ui-monospace,Menlo,monospace; --mono-w:400;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.45;
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.m{font-family:var(--mono);font-weight:var(--mono-w)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-weight:var(--mono-w);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
h1{font-size:clamp(2.6rem,9vw,6rem);font-weight:700;text-transform:uppercase;letter-spacing:-.04em;line-height:.92;margin:0;text-wrap:balance}
h2{font-size:1.05rem;font-weight:700;margin:0 0 12px}
.sub{font-family:var(--mono);font-weight:var(--mono-w);font-size:.78rem;color:var(--muted);margin:14px 0 0}
.stats{display:flex;flex-wrap:wrap;border-top:2px solid var(--fg);border-bottom:1px solid var(--line)}
.stat{flex:1 1 130px;padding:12px 14px 12px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-weight:300;font-size:2.4rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-weight:var(--mono-w);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-top:2px solid var(--fg);padding:16px;background:var(--surface);min-width:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bar h2{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.02em;text-transform:uppercase}
.nav{display:flex;gap:6px}
.nav button{font-family:var(--mono);font-weight:var(--mono-w);font-size:.8rem;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:0;padding:6px 12px;cursor:pointer}
.nav button:hover{border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-weight:var(--mono-w);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:14px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.le{border:1.5px solid var(--fg)}.lp{background:var(--accent)}.lf{background:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dow{font-family:var(--mono);font-weight:var(--mono-w);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{min-height:96px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.day.out{opacity:.35}
.day .n{font-family:var(--mono);font-weight:var(--mono-w);font-size:.74rem;color:var(--muted);align-self:flex-start;padding:1px 5px;font-variant-numeric:tabular-nums}
.day.today .n{background:var(--fg);color:var(--bg)}
.chip{font-size:.72rem;line-height:1.2;padding:3px 5px;overflow-wrap:anywhere}
.chip.entrega,.tag.entrega{border:1px solid var(--fg);color:var(--fg)}
.chip.parcial,.tag.parcial{background:var(--accent);color:var(--ink);border:1px solid var(--accent)}
.chip.final,.tag.final{background:var(--fg);color:var(--ink);border:1px solid var(--fg)}
@media(max-width:560px){
  .day{min-height:54px;flex-direction:row;flex-wrap:wrap;align-content:flex-start}
  .day .n{width:100%}
  .chip{font-size:0;padding:0;width:9px;height:9px;border-radius:50%}
}
.agenda{list-style:none;margin:0;padding:0}
.agenda li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.agenda li:last-child{border-bottom:0}
.agenda .d{font-family:var(--mono);font-weight:var(--mono-w);font-size:.82rem}
.agenda .d small{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase}
.agenda .t{min-width:0;overflow-wrap:anywhere}
.agenda .k{font-family:var(--mono);font-weight:var(--mono-w);font-size:.72rem;color:var(--muted);white-space:nowrap}
.agenda li.hot .k{color:var(--accent)}
.tag{display:inline-block;font-family:var(--mono);font-weight:var(--mono-w);font-size:.62rem;padding:1px 6px;margin-right:8px;text-transform:uppercase;letter-spacing:.06em;vertical-align:1px}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.week{border:1px solid var(--line);border-top:2px solid var(--fg);padding:16px;background:var(--surface);min-width:0}
.week.crit{border-color:var(--accent);border-top-color:var(--accent)}
.week.crit h3{color:var(--accent)}
.week h3{margin:0;font-size:1.05rem;font-weight:700}
.week .r{font-family:var(--mono);font-weight:var(--mono-w);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 0 10px}
.week ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.note{font-size:.85rem;color:var(--muted);margin:0;max-width:65ch}
</style>

<div class="wrap">
  <div class="top">
    <span>Facultad · 2.º cuatrimestre 2026</span>
  </div>
  <header>
    <h1>Calendario Facultad</h1>
    <p class="sub" id="sub"></p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="main">
    <section class="panel">
      <div class="bar">
        <h2 id="mes"></h2>
        <div class="nav"><button id="prev" aria-label="Mes anterior">←</button><button id="hoy">Hoy</button><button id="next" aria-label="Mes siguiente">→</button></div>
      </div>
      <div class="legend"><span><i class="le"></i>Entrega / exposición</span><span><i class="lp"></i>Parcial</span><span><i class="lf"></i>Final / recu</span></div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="panel">

      <ul class="agenda" id="agenda"></ul>

  </div>
  <section>
    <h2>Plan de acción por semana</h2>
    <div class="plan" id="plan"></div>
    <p class="note" style="margin-top:14px">Las fechas no tienen materia asignada en Notion, por eso no las agrupé por materia.</p>
  </section>
</div>

<script>
const LAST_SYNC="8 nov 2026";
const RAW=[
["2026-07-02","Recuperatorio?"],["2026-07-06","Final Adelantado"],["2026-07-13","Final Regular"],["2026-07-21","Final Regular"],["2026-07-23","Final regular"],
["2026-08-18","Entrega TP1"],["2026-08-24","Entrega Tp1 Dis. Corp."],["2026-08-28","Entrega TP1"],
["2026-09-01","Parcial 1"],["2026-09-02","Presentacion Manz 66"],["2026-09-21","Entrega Tp2 Dis. Corp."],["2026-09-22","Entrega Tp2"],["2026-09-23","Entrega TP1"],["2026-09-24","Parcial 1"],
["2026-10-06","Pre entrega CONCURSO"],["2026-10-07","Parcial"],["2026-10-09","Entrega TP2"],["2026-10-26","Entrega Tp3 Dis. Corp."],["2026-10-27","Parcial 2"],
["2026-11-12","Exposicion TP Grupal"],["2026-11-17","Entrega Tp2 y concurso"],["2026-11-18","Entrega TP2"],["2026-11-19","Parcial 2"],["2026-11-20","Entrega TP3"],["2026-11-24","entrega final - recu"],
["2026-11-25","Final Adelantado - Recu"],["2026-11-26","Final Adelantado - Recu"],["2026-11-27","Final Adelantado - Recu"],["2026-11-30","Entrega. Tp Final Dis. Corp."],
["2026-12-09","Final Regular"],["2026-12-11","Final Regular"],["2026-12-15","Final Regular"],["2026-12-17","Final Regular"],["2026-12-21","Final Reg. Dis. Corp."]
];
const kind=t=>{const s=t.toLowerCase();if(s.startsWith("final")||s.startsWith("recuperatorio"))return"final";if(s.startsWith("parcial"))return"parcial";return"entrega"};
const KL={entrega:"Entrega",parcial:"Parcial",final:"Final"};
const EV=RAW.map(([d,t])=>({d,t,k:kind(t)}));
const iso=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const _n=new Date(),TODAY=iso(_n.getFullYear(),_n.getMonth(),_n.getDate());
const dt=s=>new Date(s+"T12:00:00");
const diff=s=>Math.round((dt(s)-dt(TODAY))/864e5);
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS=["dom","lun","mar","mié","jue","vie","sáb"];
let vy=+TODAY.slice(0,4),vm=+TODAY.slice(5,7)-1;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function stats(){
  const up=EV.filter(e=>diff(e.d)>=0);
  const n=k=>up.filter(e=>e.k===k).length;
  document.getElementById("stats").innerHTML=
   `<div class="stat"><b>${up.length}</b><span>fechas por delante</span></div>`+
   `<div class="stat"><b>${n("entrega")}</b><span>entregas</span></div>`+
   `<div class="stat"><b>${n("parcial")}</b><span>parcial</span></div>`+
   `<div class="stat"><b>${n("final")}</b><span>finales / recu</span></div>`+
   `<div class="stat"><b>${up.length?diff(up[0].d)+" d":"-"}</b><span>a la próxima</span></div>`;
  const t=dt(TODAY);
  document.getElementById("sub").textContent=`Leído de "Calendario Principal" en Notion · actualizado ${LAST_SYNC} · hoy: ${DIAS[t.getDay()]} ${t.getDate()} ${MESES[t.getMonth()].slice(0,3)} ${t.getFullYear()}`;
}
function cal(){
  document.getElementById("mes").textContent=`${MESES[vm]} ${vy}`;
  let h="";
  ["lun","mar","mié","jue","vie","sáb","dom"].forEach(x=>h+=`<div class="dow">${x}</div>`);
  const lead=(new Date(vy,vm,1).getDay()+6)%7,dim=new Date(vy,vm+1,0).getDate();
  const cells=Math.ceil((lead+dim)/7)*7;
  for(let i=0;i<cells;i++){
    const d=new Date(vy,vm,1-lead+i),s=iso(d.getFullYear(),d.getMonth(),d.getDate());
    const ev=EV.filter(e=>e.d===s).map(e=>`<div class="chip ${e.k}" title="${esc(e.t)}">${esc(e.t)}</div>`).join("");
    h+=`<div class="day${d.getMonth()!==vm?" out":""}${s===TODAY?" today":""}"><span class="n">${d.getDate()}</span>${ev}</div>`;
  }
  document.getElementById("grid").innerHTML=h;
}
function agenda(){
  document.getElementById("agenda").innerHTML=EV.filter(e=>diff(e.d)>=0).slice(0,14).map(e=>{
    const d=dt(e.d),n=diff(e.d);
    return `<li class="${n<=7?"hot":""}"><div class="d">${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}<small>${DIAS[d.getDay()]}</small></div>
    <div class="t"><span class="tag ${e.k}">${KL[e.k]}</span>${esc(e.t)}</div><div class="k">${n===0?"hoy":n===1?"mañana":"en "+n+" d"}</div></li>`}).join("");
}
const PLAN=[
 {t:"Esta semana",r:"9 al 15 nov",items:["Jue 12: exposición del TP grupal. Ensayala el miércoles.","Avanzá lo de la semana siguiente: es la más cargada."]},
 {t:"Semana crítica",r:"16 al 22 nov",crit:1,items:["Mar 17: entrega TP2 y concurso.","Mié 18: entrega TP2.","Jue 19: Parcial 2.","Vie 20: entrega TP3.","Cuatro fechas en cuatro días. Cerrá entregas el fin de semana del 14-15 y estudiá el parcial en paralelo."]},
 {t:"Recuperatorios",r:"23 al 29 nov",items:["Mar 24: entrega final - recu.","25, 26 y 27: finales adelantados / recu.","Definí cuáles rendís y reservá un día de estudio para cada uno."]},
 {t:"Cierre de cursada",r:"30 nov al 6 dic",items:["Lun 30: entrega del TP final de Dis. Corp.","El resto de la semana, estudiá para los finales regulares."]},
 {t:"Finales regulares",r:"7 al 21 dic",items:["Mié 9, vie 11, mar 15 y jue 17: finales regulares.","Lun 21: final regular de Dis. Corp.","Entre fechas, repaso liviano; no abras un tema nuevo el día anterior."]}
];
function plan(){
  document.getElementById("plan").innerHTML=PLAN.map(w=>`<div class="week${w.crit?" crit":""}"><h3>${w.t}</h3><div class="r">${w.r}</div><ul>${w.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("");
}
document.getElementById("prev").onclick=()=>{vm--;if(vm<0){vm=11;vy--}cal()};
document.getElementById("next").onclick=()=>{vm++;if(vm>11){vm=0;vy++}cal()};
document.getElementById("hoy").onclick=()=>{vy=+TODAY.slice(0,4);vm=+TODAY.slice(5,7)-1;cal()};
stats();cal();agenda();plan();
</script>
